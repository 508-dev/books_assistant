<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payout funding — local UI preview</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #192734; background: #f5f7fa; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.preview-note { background: #fff3cd; color: #664d03; text-align: center; padding: 10px 18px; font-size: 13px; border-bottom: 1px solid #e8d89f; }
.nav { height: 58px; background: white; border-bottom: 1px solid #e2e6e9; padding: 16px 48px; display: flex; gap: 25px; align-items: center; }
.logo { background: #192734; color: white; border-radius: 7px; padding: 4px 9px; font-weight: 700; }
.muted { color: #687582; }
main { max-width: 1180px; margin: 27px auto; }
.breadcrumb { color: #687582; font-size: 13px; margin-bottom: 18px; }
.page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
h1 { margin: 0; font-size: 24px; font-weight: 600; }
.badge { font-size: 12px; padding: 4px 9px; background: #e7edf3; color: #516375; border-radius: 10px; margin-left: 10px; }
button { font: inherit; border: 0; background: #e9edf1; padding: 8px 13px; border-radius: 6px; color: #263746; }
.primary { background: #243746; color: white; }
button:disabled { background: #e3e7eb; color: #87929d; cursor: not-allowed; }
.card { background: white; border-radius: 9px; border: 1px solid #e1e6ea; padding: 26px 30px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 40px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field label { font-size: 12px; color: #5b6977; }
.field label.required::after { content: " *"; color: #c0392b; }
input, textarea { font: inherit; border: 1px solid #e2e6ea; border-radius: 6px; color: #253746; background: #f6f8fa; padding: 9px 11px; width: 100%; }
textarea { resize: none; min-height: 72px; }
.help { font-size: 11px; line-height: 1.5; color: #687582; margin-top: 0; }
.wide { grid-column: 1 / -1; }
.alert { padding: 15px 19px; border-radius: 6px; font-size: 13px; line-height: 1.65; }
.alert-warning { background: #fff7e6; border: 1px solid #f0d89e; color: #6d4d16; }
.alert-info { background: #edf5fc; border: 1px solid #cadff1; color: #245679; }
.alert p { margin: 11px 0; }
.alert p:last-child { margin-bottom: 0; }
.alert ul { padding-left: 20px; margin: 8px 0; }
.overlay { position: fixed; inset: 98px 0 0; background: #14233355; display: flex; justify-content: center; align-items: flex-start; padding: 24px 0; }
.dialog { width: 850px; background: white; border-radius: 10px; box-shadow: 0 8px 36px #14233330; overflow: hidden; }
.dialog-head { padding: 19px 24px; border-bottom: 1px solid #e8ecef; display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: 600; }
.dialog-content { padding: 21px 24px; display: flex; flex-direction: column; gap: 17px; }
.dialog-footer { border-top: 1px solid #e8ecef; padding: 15px 24px; display: flex; justify-content: flex-end; gap: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 25px; }
th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e8ecef; }
th { background: #f6f8fa; color: #687582; font-weight: 500; }
#snapshot table { margin: 0; border: 1px solid #e8ecef; }
</style>
</head>
<body>
<div class="preview-note">LOCAL UI PREVIEW · SAMPLE DATA · Funding renderer from this branch; lightweight shell, not a running ERPNext site</div>
<div class="nav"><span class="logo">B</span><b>Books Assistant</b><span class="muted">Accounting</span></div>
<main>
<div class="breadcrumb" id="breadcrumb">Accounting / Payment Entry / PE-EXAMPLE-001</div>
<div class="page-head"><div><h1 id="title">Example Engineer <span class="badge">Draft</span></h1></div><div id="actions"><button>Review payout funding</button> <button>Record bank balance</button></div></div>
<div class="card" id="payment">
<div class="grid"><div class="field"><label>Supplier</label><input value="Example Engineer" readonly></div><div class="field"><label>Paid Amount (USD)</label><input value="6,000.00" readonly></div><div class="field"><label>Company Bank Account</label><input value="Example Operating Account" readonly></div><div class="field"><label>Company</label><input value="Example Co-op" readonly></div></div>
<table><thead><tr><th>Reference</th><th>Bill</th><th>Outstanding</th><th>Allocated</th></tr></thead><tbody><tr><td>Purchase Invoice</td><td>PI-EXAMPLE-001</td><td>$6,000.00</td><td>$6,000.00</td></tr></tbody></table>
</div>
<div class="card" id="snapshot" hidden></div>
</main>
<script>
const esc = (s) => String(s ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll('"', "&quot;");
window.__ = (s, args = []) => s.replace(/\{(\d+)\}/g, (_, n) => args[n]);
window.format_currency = (value, currency) => new Intl.NumberFormat("en-US", {style: "currency", currency}).format(value);
window.books_assistant = {};
window.frappe = {
  provide() {}, utils: {escape_html: esc},
  ui: {Dialog: class {
    constructor(options) {
      this.options = options;
      this.element = document.createElement("div");
      this.element.className = "overlay";
      const fields = options.fields.filter((field) => !field.hidden).map((field) => {
        if (field.fieldtype === "HTML") return field.options;
        return `<div class="field"><label class="${field.reqd ? 'required' : ''}">${esc(field.label)}</label><textarea>${esc(field.default || '')}</textarea></div>`;
      }).join("");
      this.element.innerHTML = `<div class="dialog"><div class="dialog-head">${esc(options.title)}<span class="muted">×</span></div><div class="dialog-content">${fields}</div><div class="dialog-footer"><button>Close</button><button class="primary">${esc(options.primary_action_label)}</button></div></div>`;
    }
    show() { document.body.append(this.element); }
    get_primary_btn() { return {prop: (key, value) => { this.element.querySelector(".primary")[key] = value; }}; }
  }},
};
</script>
<script src="../books_assistant/public/js/funding.js"></script>
<script>
(async () => {
  const scenario = new URLSearchParams(location.search).get("scenario") || "shortfall";
  const cash = {snapshot: "BALANCE-EXAMPLE-001", available_balance: 8000, pending_outflows: 1000, reserved: 2000, minimum_buffer: 1000, available_for_payout: 4000, amount: 6000, after_payout: -2000, shortfall: 2000, balance_as_of: "2026-11-13 09:00:00", status: "blocked", reason: "cash_shortfall"};
  const report = {version: 1, currency: "USD", cash, issues: [], can_approve: false, fronting_required: true, clients: [{bill: "PI-EXAMPLE-001", status: "unpaid", invoices: [{invoice: "SI-EXAMPLE-001", status: "unpaid", outstanding: 10000}]}]};
  if (scenario === "fronting") {
    Object.assign(cash, {available_balance: 16000, available_for_payout: 12000, after_payout: 6000, shortfall: 0, status: "sufficient", reason: null});
    report.can_approve = true;
  }
  if (scenario === "snapshot") {
    document.querySelector("#payment").hidden = true;
    document.querySelector("#breadcrumb").textContent = "Accounting / Bank Funding Snapshot / BALANCE-EXAMPLE-001";
    document.querySelector("#title").innerHTML = 'Bank Funding Snapshot <span class="badge">Recorded</span>';
    document.querySelector("#actions").innerHTML = '<button class="primary">New snapshot</button>';
    const schema = await (await fetch("../books_assistant/books_assistant/doctype/bank_funding_snapshot/bank_funding_snapshot.json")).json();
    const values = {bank_account: "Example Operating Account", company: "Example Co-op", currency: "USD", balance_as_of: "2026-11-13 09:00:00", available_balance: "8,000.00", pending_outflows: "1,000.00", minimum_buffer: "1,000.00", notes: "Sample evidence: available balance checked in the bank portal. Other commitments exclude active ERP reservations and amounts already deducted by the bank."};
    const fields = schema.field_order.map((name) => schema.fields.find((field) => field.fieldname === name)).map((field) => {
      const wide = ["Small Text", "Table"].includes(field.fieldtype);
      let control = `<input readonly value="${esc(values[field.fieldname])}">`;
      if (field.fieldtype === "Small Text") control = `<textarea readonly>${esc(values[field.fieldname])}</textarea>`;
      if (field.fieldtype === "Table") control = '<table><thead><tr><th>Reservation</th></tr></thead><tbody><tr><td class="muted">No reservations marked as reflected in this example</td></tr></tbody></table>';
      return `<div class="field ${wide ? 'wide' : ''}"><label class="${field.reqd ? 'required' : ''}">${esc(field.label)}</label>${control}${field.description ? `<div class="help">${esc(field.description)}</div>` : ''}</div>`;
    }).join("");
    const form = document.querySelector("#snapshot");
    form.hidden = false;
    form.innerHTML = '<div class="alert alert-warning" style="margin-bottom:24px">Read the available balance in your bank portal. Include only commitments not already deducted by the bank or reserved here. Mark a reservation reflected only after its transfer is deducted in this balance.</div><div class="grid">'+fields+'</div>';
  } else {
    frappe.call = async () => ({message: report});
    await books_assistant.review_funding({doc: {name: "PE-EXAMPLE-001"}, is_new: () => false, is_dirty: () => false});
  }
  window.preview_ready = true;
})();
</script>
</body>
</html>
